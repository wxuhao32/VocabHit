plugins {
    id "com.android.application"
}

android {
    namespace "com.wxh.vocabulary"
    compileSdk 34

    defaultConfig {
        applicationId "com.wxh.vocabulary"
        minSdk 26
        targetSdk 34
        versionCode 96
        versionName "1.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
