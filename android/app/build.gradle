plugins {
    id "com.android.application"
}

android {
    namespace "com.wxh.vocabulary"
    compileSdk 34

    defaultConfig {
        applicationId "com.wxh.vocabulary"
        minSdk 26
        targetSdk 34
        versionCode 60
        versionName "0.8.16"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
// 唯一原生依赖：ML Kit 文字识别（bundled 模型打包进 APK，完全离线运行，
// 无需 Google Play Services）。中文识别器覆盖中英混排；Latin 识别器对英文
// 字母/词间空格/标点更准 —— 纯英文页面自动切换 Latin 引擎
dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'
    implementation 'com.google.mlkit:text-recognition:16.0.0'
}
