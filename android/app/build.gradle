// 鏃犻渶 Google Play Services锛夈€備腑鏂囪瘑鍒櫒瑕嗙洊涓嫳娣锋帓锛汱atin 璇嗗埆鍣ㄥ鑻辨枃
// 瀛楁瘝/璇嶉棿绌烘牸/鏍囩偣鏇村噯 鈥斺€?绾嫳鏂囬〉闈㈣嚜鍔ㄥ垏鎹?Latin 寮曟搸
dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    // PDF 文本层解析（pdfbox-android：字符级坐标提取，供双栏/表格/标题结构重建）
