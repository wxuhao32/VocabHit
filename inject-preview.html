<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VocabHit · 注入测试数据并预览 Review / Spell</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0f1220;color:#e8eaf2;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:#1a1f35;border:1px solid #2c3354;border-radius:16px;padding:32px 36px;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  h2{margin:0 0 6px;font-size:20px}
  .sub{color:#9aa3c7;font-size:13px;margin-bottom:18px}
  .words{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
  .chip{background:#232a47;border:1px solid #34406b;border-radius:999px;padding:5px 12px;font-size:13px}
  .btns{display:flex;gap:12px;flex-wrap:wrap}
  button{flex:1;min-width:180px;cursor:pointer;border:none;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:600;color:#fff;transition:.15s}
  button:hover{transform:translateY(-1px)}
  .b-meaning{background:linear-gradient(135deg,#5b6cff,#7a5bff)}
  .b-spell{background:linear-gradient(135deg,#19b27a,#13a0c7)}
  .status{margin-top:18px;font-size:13px;color:#7fe0b0;min-height:18px}
  .note{margin-top:14px;font-size:12px;color:#7b83a8;line-height:1.6}
  code{background:#0c0f1d;padding:1px 6px;border-radius:5px;color:#9fd0ff}
</style>
</head>
<body>
<div class="card">
  <h2>VocabHit 预览数据注入器</h2>
  <div class="sub">不改动任何源码 · 仅向 localStorage 写入测试数据 · 注入后自动打开应用</div>

  <div class="words" id="words"></div>

  <div class="btns">
    <button class="b-meaning" data-mode="meaning">预览：词义复习（完整流程）</button>
    <button class="b-spell" data-mode="spell">预览：拼写复习（直达）</button>
  </div>

  <div class="status" id="status"></div>
  <div class="note">
    词义复习预览会依次进入 <b>词义回忆 → 过渡页 → 拼写复习</b>，覆盖完整两阶段；<br>
    拼写复习预览会直接跳到拼写阶段，方便单独查看拼写效果。<br>
    注入内容：12 个考研词典内单词（含真实释义），分布在长期/每日/强化等多种复习状态。
  </div>
</div>

<script>
(function(){
  // 与 app.js 完全一致的词汇日算法（04:00 为边界）
  function vocabDay(now){
    const d = new Date(now.getTime() - 4*3600*1000);
    const p = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  }
  function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

  // 12 个真实存在于考研词书的单词 + 多样化复习状态
  const WORDS = [
    {w:"abandon",      known:3,  fuzzy:1,  unknown:0, stage:2, mode:"long",    bar:"rgba(91,108,255,.9)"},
    {w:"ambiguous",    known:2,  fuzzy:2,  unknown:1, stage:1, mode:"daily",   bar:"rgba(245,166,35,.9)"},
    {w:"articulate",   known:5,  fuzzy:0,  unknown:1, stage:3, mode:"long",    bar:"rgba(91,108,255,.9)"},
    {w:"comprehensive",known:4,  fuzzy:1,  unknown:0, stage:2, mode:"booster", bar:"rgba(19,176,122,.9)"},
    {w:"circumstance", known:7,  fuzzy:1,  unknown:0, stage:4, mode:"long",    bar:"rgba(91,108,255,.9)"},
    {w:"contemplate",  known:1,  fuzzy:3,  unknown:2, stage:1, mode:"long",    bar:"rgba(91,108,255,.9)"},
    {w:"deteriorate",  known:0,  fuzzy:1,  unknown:1, stage:0, mode:"",        bar:"rgba(160,170,200,.7)"},
    {w:"fundamental",  known:9,  fuzzy:2,  unknown:0, stage:5, mode:"long",    bar:"rgba(91,108,255,.9)"},
    {w:"simultaneous", known:3,  fuzzy:3,  unknown:1, stage:3, mode:"daily",   bar:"rgba(245,166,35,.9)"},
    {w:"sophisticated",known:4,  fuzzy:2,  unknown:1, stage:2, mode:"long",    bar:"rgba(91,108,255,.9)"},
    {w:"tremendous",   known:2,  fuzzy:3,  unknown:0, stage:1, mode:"booster", bar:"rgba(19,176,122,.9)"},
    {w:"vulnerable",   known:11, fuzzy:1,  unknown:0, stage:6, mode:"long",    bar:"rgba(91,108,255,.9)"}
  ];

  document.getElementById("words").innerHTML =
    WORDS.map(x=>`<span class="chip">${x.w}</span>`).join("");

  function buildData(mode){
    const now = Date.now();
    const dayOld = vocabDay(now - 7*86400000);
    const records = { day: vocabDay(now), history: [], words: {} };
    const review  = { words: {} };

    WORDS.forEach((x,i)=>{
      const total = x.known + x.fuzzy + x.unknown;
      // 生词本记录（必须 starred，否则 syncReviewWithWords 会清掉 Review 词条）
      records.words[x.w] = {
        today: 1, total, first: dayOld, last: now - 3600000,
        starred: true, starredAt: now - 7*86400000, firstQueriedAt: now - 7*86400000,
        deleted: false
      };
      // Review 状态（nextAt 设为已到期，进入待复习队列）
      review.words[x.w] = {
        known: x.known, fuzzy: x.fuzzy, unknown: x.unknown, total,
        firstAt: now - 7*86400000, lastAt: now - 3600000,
        stage: x.stage, mode: x.mode,
        origStage: (x.mode === "daily" || x.mode === "booster") ? Math.max(1, x.stage) : 0,
        nextAt: now - (WORDS.length - i) * 600000
      };
    });

    // 复习会话（day 必须 == vocabDay() 才能被 openReview 恢复）
    const queue = WORDS.map(x=>x.w);
    const session = {
      day: vocabDay(now),
      phase: mode === "spell" ? "spell" : "meaning",
      queue,
      idx: 0, step: "answer", current: null, lastResult: null, snapshot: null,
      stats: { n:0, known:0, fuzzy:0, unknown:0 },
      spellQueue: mode === "spell" ? shuffle(queue) : [],
      spellIdx: 0,
      spell: { submitted:false, correct:false, input:"" },
      spellStats: { correct:0, wrong:0, skipped:0 }
    };

    localStorage.setItem("vc-records", JSON.stringify(records));
    localStorage.setItem("vc-review", JSON.stringify(review));
    localStorage.setItem("vc-review-session-v2", JSON.stringify(session));
    return queue.length;
  }

  const statusEl = document.getElementById("status");
  document.querySelectorAll("button[data-mode]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const mode = btn.dataset.mode;
      const n = buildData(mode);
      statusEl.textContent = `✅ 已注入 ${n} 个测试单词（${mode === "spell" ? "拼写" : "词义"}阶段）· 正在打开应用…`;
      setTimeout(()=>{ window.location.href = "index.html"; }, 750);
    });
  });

  // 若通过 ?mode=xxx 直接访问，自动注入并跳转
  const pm = new URLSearchParams(location.search).get("mode");
  if (pm === "meaning" || pm === "spell"){
    const n = buildData(pm);
    statusEl.textContent = `✅ 已注入 ${n} 个测试单词（${pm === "spell" ? "拼写" : "词义"}阶段）· 正在打开应用…`;
    setTimeout(()=>{ window.location.href = "index.html"; }, 750);
  }
})();
</script>
</body>
</html>
