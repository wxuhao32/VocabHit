<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F7F8" />
  <title>VocabHit — 考研词汇查询</title>
  <link rel="stylesheet" href="css/style.css?v=9" />
  <link rel="stylesheet" href="css/knowledge.css?v=9" />
</head>
<body>

  <!-- 移动端应用容器 -->
  <div class="app" id="app">

    <!-- ============ 首页 Home ============ -->
    <main class="page active" id="page-home">
      <header class="page-header">
        <h1 class="large-title">VocabHit</h1>
        <p class="greeting" id="greeting">你好</p>
      </header>

      <!-- 搜索框 -->
      <button class="search-bar" id="search-entry" type="button" aria-label="搜索单词">
        <svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/>
        </svg>
        <span class="search-bar-placeholder">搜索单词...</span>
      </button>

      <!-- 今日数据 -->
      <section class="stats" aria-label="今日数据">
        <p class="section-eyebrow">今日</p>
        <div class="stats-row">
          <div class="stat">
            <span class="stat-num" id="stat-new">0</span>
            <span class="stat-label">新增生词</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat">
            <span class="stat-num" id="stat-queries">0</span>
            <span class="stat-label">查询次数</span>
          </div>
        </div>
      </section>

      <!-- Review 复习入口 -->
      <button class="review-entry" id="review-entry" type="button">
        <span class="review-entry-icon">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 11a7 7 0 1 1 13 2.5L14.5 16H10"/>
            <path d="M10 8v3l2 1.5"/>
          </svg>
        </span>
        <span class="review-entry-main">
          <span class="review-entry-title">Review</span>
          <span class="review-entry-sub" id="review-count">今日无需复习</span>
        </span>
        <svg class="icon icon-s review-entry-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3l5 5-5 5"/>
        </svg>
      </button>

      <!-- 番茄钟入口 -->
      <button class="review-entry pomo-entry" id="pomo-entry" type="button">
        <span class="review-entry-icon pomo-entry-icon">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="10" r="7"/>
            <path d="M10 6.5V10l2.5 1.5"/>
          </svg>
        </span>
        <span class="review-entry-main">
          <span class="review-entry-title">番茄钟</span>
          <span class="review-entry-sub" id="pomo-count">专注学习 · 今日 0 个番茄</span>
        </span>
        <svg class="icon icon-s review-entry-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3l5 5-5 5"/>
        </svg>
      </button>

      <!-- 昨日任务反馈（有昨日任务记录时显示） -->
      <div class="tasks-feedback" id="tasks-feedback" style="display:none"></div>

      <!-- 待办任务入口 -->
      <button class="review-entry tasks-entry" id="tasks-entry" type="button">
        <span class="review-entry-icon tasks-entry-icon">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="4" width="13" height="13" rx="2.5"/>
            <path d="M6.5 10.5l2.2 2.2 4.8-5"/>
          </svg>
        </span>
        <span class="review-entry-main">
          <span class="review-entry-title">任务</span>
          <span class="review-entry-sub" id="tasks-count">暂无任务 · 点击添加</span>
        </span>
        <svg class="icon icon-s review-entry-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3l5 5-5 5"/>
        </svg>
      </button>

      <!-- 坚持看板入口 -->
      <button class="review-entry habits-entry" id="habits-entry" type="button">
        <span class="review-entry-icon habits-entry-icon">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="4.5" width="13" height="12" rx="2"/>
            <path d="M6.5 9.5v3M10 8v4.5M13.5 10.5v2"/>
          </svg>
        </span>
        <span class="review-entry-main">
          <span class="review-entry-title">坚持看板</span>
          <span class="review-entry-sub" id="habits-count">连续打卡 · 查看坚持情况</span>
        </span>
        <svg class="icon icon-s review-entry-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3l5 5-5 5"/>
        </svg>
      </button>

      <!-- 今日生词 -->
      <section class="section">
        <div class="section-head">
          <h2 class="section-title">今日生词</h2>
        </div>
        <ul class="word-list" id="home-word-list">
          <!-- JS 渲染 -->
        </ul>
        <button class="view-all" id="view-all" type="button">查看全部
          <svg class="icon icon-s" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3l5 5-5 5"/>
          </svg>
        </button>
      </section>
    </main>

    <!-- ============ 生词页 Words（今日生词 | 历史生词 平级切换） ============ -->
    <main class="page" id="page-words">
      <header class="page-header">
        <button class="back-btn" data-back="home" type="button" aria-label="返回">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3L5 8l5 5"/>
          </svg>
        </button>
        <h1 class="page-title">生词</h1>
      </header>
      <div class="segmented wide words-seg" id="words-seg" role="radiogroup" aria-label="生词视图">
        <button class="seg-btn" data-value="today" role="radio" aria-checked="true">今日生词</button>
        <button class="seg-btn" data-value="starred" role="radio" aria-checked="false">历史生词</button>
      </div>
      <p class="page-subtitle"><span id="words-count">0</span> 个生词 · <span id="words-sub-label">今日 0 次查询</span></p>
      <ul class="word-list detailed" id="words-list">
        <!-- JS 渲染 -->
      </ul>
    </main>

    <!-- ============ 查询记录页 History ============ -->
    <main class="page" id="page-history">
      <header class="page-header">
        <h1 class="large-title">查询记录</h1>
      </header>
      <p class="page-subtitle muted">全部查询 · 按时间倒序</p>
      <ul class="history-list" id="history-list">
        <!-- JS 渲染 -->
      </ul>
    </main>

    <!-- ============ 设置页 Settings ============ -->
    <main class="page" id="page-settings">
      <header class="page-header">
        <h1 class="large-title">设置</h1>
      </header>

      <section class="settings-group">
        <h2 class="settings-group-title">通用</h2>
        <div class="settings-list">
          <div class="settings-item">
            <div class="settings-item-label">
              <span>外观</span>
            </div>
            <div class="segmented" id="appearance-seg" role="radiogroup" aria-label="外观">
              <button class="seg-btn" data-value="light" role="radio" aria-checked="false">浅色</button>
              <button class="seg-btn" data-value="dark" role="radio" aria-checked="false">深色</button>
              <button class="seg-btn" data-value="system" role="radio" aria-checked="false">跟随系统</button>
            </div>
          </div>
          <div class="settings-item">
            <div class="settings-item-label">
              <span>每日重置</span>
              <span class="settings-item-value">04:00</span>
            </div>
            <svg class="icon chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 3l5 5-5 5"/>
            </svg>
          </div>
          <div class="settings-item" id="overlay-item" hidden>
            <div class="settings-item-label">
              <span>后台悬浮查词</span>
              <span class="settings-item-value" id="overlay-value">关</span>
            </div>
            <button class="switch" id="overlay-switch" type="button" role="switch" aria-checked="false" aria-label="后台悬浮查词">
              <span class="switch-knob"></span>
            </button>
          </div>
        </div>
      </section>

      <section class="settings-group">
        <h2 class="settings-group-title">数据</h2>
        <div class="settings-list">
          <button class="settings-item clickable" id="export-entry" type="button">
            <div class="settings-item-label">
              <span>导出</span>
              <span class="settings-item-value">PDF · Word · PNG</span>
            </div>
            <svg class="icon chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 3l5 5-5 5"/>
            </svg>
          </button>
        </div>
      </section>

      <section class="settings-group">
        <h2 class="settings-group-title">关于</h2>
        <div class="settings-list">
          <div class="settings-item">
            <div class="settings-item-label">
              <span>版本</span>
              <span class="settings-item-value">0.8.17</span>
            </div>
          </div>
        </div>
      </section>

      <p class="settings-footer">极简 · 安静 · 干净 · 高级 · 高效</p>
    </main>

    <!-- ============ 导出页 Export ============ -->
    <main class="page page-stack" id="page-export">
      <header class="page-header">
        <button class="back-btn" data-back="settings" type="button" aria-label="返回">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3L5 8l5 5"/>
          </svg>
        </button>
      </header>

      <section class="export-hero">
        <p class="export-meta" id="export-meta-date">—</p>
        <p class="export-meta muted" id="export-meta-count">0 个生词 · 0 次查询</p>
      </section>

      <section class="export-field">
        <p class="field-label">导出内容</p>
        <div class="segmented wide" id="content-seg" role="radiogroup" aria-label="导出内容">
          <button class="seg-btn" data-value="today" role="radio" aria-checked="true">今日生词</button>
          <button class="seg-btn" data-value="starred" role="radio" aria-checked="false">历史生词</button>
        </div>
      </section>

      <section class="export-field">
        <p class="field-label">格式</p>
        <div class="segmented wide" id="format-seg" role="radiogroup" aria-label="导出格式">
          <button class="seg-btn" data-value="pdf" role="radio" aria-checked="true">PDF</button>
          <button class="seg-btn" data-value="word" role="radio" aria-checked="false">Word</button>
          <button class="seg-btn" data-value="png" role="radio" aria-checked="false">PNG</button>
        </div>
      </section>

      <section class="export-field">
        <p class="field-label">导出样式</p>
        <div class="segmented wide" id="style-seg" role="radiogroup" aria-label="导出样式">
          <button class="seg-btn" data-value="clean" role="radio" aria-checked="true">清爽</button>
          <button class="seg-btn" data-value="compact" role="radio" aria-checked="false">紧凑</button>
          <button class="seg-btn" data-value="notes" role="radio" aria-checked="false">学习笔记</button>
        </div>
      </section>

      <button class="primary-btn" id="export-btn" type="button">导出</button>
    </main>

    <!-- ============ Review 复习页 ============ -->
    <main class="page" id="page-review">
      <header class="page-header">
        <button class="back-btn" data-back="home" type="button" aria-label="返回">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3L5 8l5 5"/>
          </svg>
        </button>
        <button class="page-header-action" id="review-clear" type="button" aria-label="清空复习队列">清空</button>
      </header>
      <!-- 沉浸式顶部进度区：极细进度条 + 轻量计数（JS 控制显隐与宽度） -->
      <div class="rv-topbar" id="rv-topbar" hidden>
        <div class="rv-topbar-track"><div class="rv-topbar-fill" id="rv-topbar-fill"></div></div>
        <p class="rv-topbar-count" id="rv-topbar-count"></p>
      </div>
      <div class="review-body" id="review-body">
        <!-- JS 渲染：复习卡 / 详情 / 拼写 / 完成 -->
      </div>
    </main>

    <!-- ============ 番茄钟页 ============ -->
    <main class="page" id="page-pomo">
      <header class="page-header" id="pomo-header">
        <button class="back-btn" data-back="home" type="button" aria-label="返回">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3L5 8l5 5"/>
          </svg>
        </button>
        <h1 class="page-title">番茄钟</h1>
      </header>
      <div class="pomo-body" id="pomo-body">
        <!-- JS 渲染：配置视图 / 运行视图 -->
      </div>
    </main>

    <!-- ============ 任务页 ============ -->
    <main class="page" id="page-tasks">
      <header class="page-header">
        <button class="back-btn" data-back="home" type="button" aria-label="返回">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3L5 8l5 5"/>
          </svg>
        </button>
        <h1 class="page-title">任务</h1>
      </header>
      <div class="tasks-body" id="tasks-body">
        <!-- JS 渲染：今日任务 / 目标 / 奖励 / 创建表单 -->
      </div>
    </main>

    <!-- ============ 坚持看板页 ============ -->
    <main class="page" id="page-habits">
      <header class="page-header">
        <button class="back-btn" data-back="home" type="button" aria-label="返回">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3L5 8l5 5"/>
          </svg>
        </button>
        <h1 class="page-title">坚持看板</h1>
      </header>
      <div class="habits-body" id="habits-body">
        <!-- JS 渲染：统计 / 日历 / 目标进度 -->
      </div>
    </main>

    <!-- ============ 搜索 Bottom Sheet ============ -->
    <div class="sheet-overlay" id="sheet-overlay" aria-hidden="true"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="sheet-grabber"></div>
      <div class="sheet-search">
        <svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/>
        </svg>
        <input id="sheet-input" type="text" placeholder="输入单词查释义 · 输入中文找单词" autocomplete="off" />
        <button class="sheet-close" id="sheet-close" type="button" aria-label="关闭">取消</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>

    <!-- ============ 底部导航 ============ -->
    <nav class="tabbar" id="tabbar" aria-label="主导航">
      <button class="tab active" data-tab="home" type="button">
        <svg class="icon" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 10.5L11 4l7 6.5"/><path d="M6 10v7h10v-7"/>
        </svg>
        <span>首页</span>
      </button>
      <button class="tab" data-tab="words" type="button">
        <svg class="icon" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 4h9l3 3v11H5z"/><path d="M8 9h6M8 12.5h6"/>
        </svg>
        <span>生词</span>
      </button>
      <button class="tab" data-tab="history" type="button">
        <svg class="icon" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7.5"/><path d="M11 7v4l3 2"/>
        </svg>
        <span>记录</span>
      </button>
      <button class="tab" data-tab="settings" type="button">
        <svg class="icon" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="3"/><path d="M11 3.5v2M11 16.5v2M3.5 11h2M16.5 11h2M5.8 5.8l1.4 1.4M14.8 14.8l1.4 1.4M16.2 5.8l-1.4 1.4M7.2 14.8l-1.4 1.4"/>
        </svg>
        <span>设置</span>
      </button>
    </nav>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="js/dict.js"></script>
  <script src="js/ecdict.js"></script>
  <script src="js/app.js?v=13"></script>
  <script src="js/knowledge.js?v=13"></script>
</body>
</html>
